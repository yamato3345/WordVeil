<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selected Word</title>
    <style>
      :root {
        --panel-bg: rgba(15, 18, 24, 0.8);
        --panel-border: rgba(255, 255, 255, 0.12);
        --text: #f5f7fb;
        --label: rgba(220, 228, 255, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        background: transparent;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      .word-panel {
        min-width: 180px;
        max-width: 260px;
        padding: 10px 12px 12px;
        border-radius: 16px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        box-shadow: 0 20px 32px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        color: var(--text);
        backdrop-filter: blur(12px);
      }

      .word-panel__label {
        display: block;
        margin-bottom: 4px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--label);
      }

      .word-panel__value {
        display: block;
        font-size: 20px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div class="word-panel" aria-live="polite">
      <span class="word-panel__label">Selected word</span>
      <strong id="wordValue" class="word-panel__value">word</strong>
    </div>

    <script>
      const valueEl = document.getElementById('wordValue');



      function setWord(nextWord) {
        const text = typeof nextWord === 'string' ? nextWord.trim() : '';
        if (!valueEl) return;
        valueEl.textContent = text || '';

      }

      window.__WORDVEIL_SET_WORD = setWord;

      const params = new URLSearchParams(window.location.search);
      const initialWord = params.get('word');
      if (initialWord) {
        setWord(initialWord);
      }
    </script>
  </body>
</html>
