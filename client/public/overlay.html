<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selected Word</title>
    <style>
      :root {
        --bg: rgba(18, 22, 31, 0.82);
        --border: rgba(146, 182, 255, 0.46);
        --text: #edf4ff;
        --label: rgba(208, 223, 255, 0.72);
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }

      .panel {
        min-width: 180px;
        max-width: 220px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 18px 34px rgba(7, 13, 21, 0.36);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--text);
        pointer-events: none;
      }

      .label {
        display: block;
        margin-bottom: 6px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--label);
      }

      .value {
        display: block;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 700;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <span class="label">Selected word</span>
      <strong class="value" id="wordValue"></strong>
    </div>

    <script>
      const tauriApi = window.__TAURI_INTERNALS__ || window.__TAURI__;
      const invoke = tauriApi?.invoke ?? null;
      const tauriEvent = tauriApi?.event ?? null;
      const overlaySettings = window.__WORDVEIL_OVERLAY_SETTINGS || {
        closeDelay: 3300,
        updateEventName: "word-overlay:update",
        fallbackText: "",
      };
      const params = new URLSearchParams(window.location.search);
      const initialWord = decodeURIComponent(params.get("word") || "").trim();
      const wordNode = document.getElementById("wordValue");

      const renderWord = (nextWord) => {
        if (!wordNode) {
          return;
        }

        const value = typeof nextWord === "string" ? nextWord.trim() : "";
        wordNode.textContent = value || overlaySettings.fallbackText || "";

        if (value) {
          scheduleClose();
        }
      };

      let closed = false;
      let closeTimer = null;

      const closeOverlay = async () => {
        if (closed) {
          return;
        }

        closed = true;
        try {
          await invoke("close_word_overlay");
        } catch (_error) {
          window.close();
        }
      };

      const scheduleClose = () => {
        if (closeTimer) {
          clearTimeout(closeTimer);
        }

        closeTimer = setTimeout(() => {
          void closeOverlay();
        }, overlaySettings.closeDelay);
      };

      window.__WORDVEIL_SET_WORD = (nextWord) => {
        renderWord(nextWord);
      };

      const hydrateInitialWord = async () => {
        try {
          const currentWord = await invoke("get_overlay_word");
          const fromState = typeof currentWord === "string" ? currentWord.trim() : "";
          renderWord(fromState || initialWord);
        } catch (_error) {
          renderWord(initialWord);
        }

        if (!initialWord && !wordNode?.textContent) {
          scheduleClose();
        }
      };

      void hydrateInitialWord();
      scheduleClose();

      if (tauriEvent && typeof tauriEvent.listen === "function") {
        tauriEvent.listen(overlaySettings.updateEventName, (event) => {
          const nextWord = event?.payload?.word;
          window.__WORDVEIL_SET_WORD(typeof nextWord === "string" ? nextWord : "");
        });
      }

      document.addEventListener("mousedown", () => {
        void closeOverlay();
      });
      document.addEventListener("pointerdown", () => {
        void closeOverlay();
      });
      document.addEventListener("touchstart", () => {
        void closeOverlay();
      }, { passive: true });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          void closeOverlay();
        }
      });

      window.addEventListener("blur", () => {
        void closeOverlay();
      });
    </script>
  </body>
</html>
