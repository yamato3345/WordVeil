<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selected Word</title>
    <style>
      :root {
        --bg: rgba(18, 22, 31, 0.82);
        --border: rgba(146, 182, 255, 0.46);
        --text: #edf4ff;
        --label: rgba(208, 223, 255, 0.72);
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }

      .panel {
        min-width: 180px;
        max-width: 220px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 18px 34px rgba(7, 13, 21, 0.36);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--text);
        pointer-events: none;
      }

      .label {
        display: block;
        margin-bottom: 6px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--label);
      }

      .value {
        display: block;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 700;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <span class="label">Selected word</span>
      <strong class="value" id="wordValue">word</strong>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const rawWord = params.get("word") || "word";
      const word = decodeURIComponent(rawWord);
      document.getElementById("wordValue").textContent = word || "word";

      const closeOverlay = () => {
        window.close();
      };

      setTimeout(closeOverlay, 3500);
      document.addEventListener("mousedown", closeOverlay);
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          closeOverlay();
        }
      });
    </script>
  </body>
</html>
